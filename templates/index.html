<!DOCTYPE html>
<html>
<head>
<title>IPTV PRO</title>

<style>
body{
background:#0d0d0d;
color:white;
font-family:Arial;
text-align:center;
}

textarea{
width:90%;
height:150px;
background:#1a1a1a;
color:white;
border:1px solid #333;
}

button{
padding:10px;
margin:5px;
background:#00ff88;
border:none;
cursor:pointer;
}

.ok{color:#00ff88;}
.bad{color:#ff4d4d;}
.err{color:#ffaa00;}

.card{
background:#1a1a1a;
padding:10px;
margin:10px;
border-radius:10px;
text-align:left;
}
</style>

</head>

<body>

<h1>🔥 IPTV PANEL PRO</h1>

<textarea id="listas" placeholder="Pega listas aquí"></textarea><br><br>

<input type="file" id="fileInput">
<button onclick="cargarArchivo()">Cargar TXT</button><br><br>

<button onclick="check()">Verificar</button>
<button onclick="soloOK()">Solo válidas</button>
<button onclick="exportar()">Exportar válidas</button>

<div id="stats"></div>

<h2>Resultados</h2>
<div id="res"></div>

<script>

let globalData = [];

function check(){
let texto = document.getElementById("listas").value;

fetch("/check",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({listas:texto})
})
.then(r=>r.json())
.then(data=>{
globalData=data;
mostrar(data);
});
}

function mostrar(data){
let ok=0, bad=0, err=0;
let html="";

data.forEach(x=>{
if(x.estado=="OK"){
ok++;
html += `<div class="card ok">✅ ${x.user} | ${x.pass}</div>`;
}
else if(x.estado=="BAD"){
bad++;
html += `<div class="card bad">❌ ${x.user}</div>`;
}
else{
err++;
html += `<div class="card err">⚠️ ERROR</div>`;
}
});

document.getElementById("stats").innerHTML =
`✅ ${ok} | ❌ ${bad} | ⚠️ ${err}`;

document.getElementById("res").innerHTML = html;
}

function soloOK(){
mostrar(globalData.filter(x=>x.estado=="OK"));
}

function exportar(){
fetch("/export",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({data:globalData})
})
.then(res=>res.blob())
.then(blob=>{
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="hits.txt";
a.click();
});
}

function cargarArchivo(){
let file=document.getElementById("fileInput").files[0];
if(!file){ alert("Selecciona archivo"); return; }

let reader=new FileReader();
reader.onload=function(e){
document.getElementById("listas").value=e.target.result;
};
reader.readAsText(file);
}

</script>

</body>
</html>
