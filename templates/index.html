<!DOCTYPE html>
<html>
<head>
<title>IPTV PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#0d0d0d;color:white;font-family:Arial;text-align:center;}
textarea{width:90%;height:150px;background:#1a1a1a;color:white;}
button{padding:10px;margin:5px;background:#00ff88;border:none;}
.card{background:#1a1a1a;padding:10px;margin:10px;border-radius:10px;text-align:left;}
.ok{border-left:5px solid #00ff88;}
.bad{border-left:5px solid red;}
.err{border-left:5px solid orange;}
.proceso{color:yellow;}
</style>

</head>

<body>

<h1>🔥 IPTV PANEL PRO</h1>

<textarea id="listas"></textarea><br><br>

<input type="file" id="fileInput">
<button onclick="cargarArchivo()">Cargar TXT</button><br><br>

<button onclick="check()">Verificar</button>
<button onclick="autoScan()">Auto Scan</button>
<button onclick="exportar()">Exportar HIT</button>

<canvas id="grafica" width="300" height="150"></canvas>

<div id="res"></div>

<script>

let globalData=[];
let scanning=false;

// VERIFICACIÓN CON ANIMACIÓN
async function check(){
let lineas=document.getElementById("listas").value.split("\n");

let resDiv=document.getElementById("res");
resDiv.innerHTML="";

for(let l of lineas){

if(!l.includes("get.php")) continue;

resDiv.innerHTML += `<div class="proceso">⏳ Procesando: ${l}</div>`;

let r=await fetch("/check",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({listas:l})
});

let data=await r.json();
globalData.push(data[0]);

mostrar();
}
}

// MOSTRAR RESULTADOS + GRÁFICA
function mostrar(){
let ok=0,bad=0,err=0;
let html="";

globalData.forEach(x=>{
if(x.estado=="OK"){
ok++;
html+=`<div class="card ok">👑 ${x.user} | ${x.pass}</div>`;
}
else if(x.estado=="BAD"){bad++;}
else{err++;}
});

document.getElementById("res").innerHTML=html;

grafica(ok,bad,err);
}

// GRÁFICA
function grafica(ok,bad,err){
new Chart(document.getElementById("grafica"),{
type:"doughnut",
data:{
labels:["OK","BAD","ERROR"],
datasets:[{
data:[ok,bad,err]
}]
}
});
}

// AUTO SCAN
function autoScan(){
scanning=true;
setInterval(()=>{
if(scanning) check();
},5000);
}

// EXPORTAR
function exportar(){
fetch("/export",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({data:globalData})
})
.then(res=>res.blob())
.then(blob=>{
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="hits.txt";
a.click();
});
}

// CARGAR TXT
function cargarArchivo(){
let file=document.getElementById("fileInput").files[0];
let reader=new FileReader();
reader.onload=e=>{
document.getElementById("listas").value=e.target.result;
};
reader.readAsText(file);
}

</script>

</body>
</html>
